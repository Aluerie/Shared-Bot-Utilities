name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      # for the scheduler's integration tests; the same major version as on the VPS
      postgres:
        image: postgres:19
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        # The code imports itself as `shared.*`, so it has to live in a folder named `shared`.
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
        with:
          path: shared

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: shared/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
        env:
          SHARED_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/postgres
